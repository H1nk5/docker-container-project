# =============================================================
# Docker Compose - 5 容器架构
# 学生: lh  学号: 202312080114
# 架构: Nginx(80) -> Flask1/Flask2 -> Redis + MySQL
# =============================================================

version: "3.8"

services:
  # -----------------------------------------------------------
  # 1. Nginx - 反向代理 & 负载均衡
  # -----------------------------------------------------------
  nginx:
    image: docker.m.daocloud.io/library/nginx:1.24-alpine
    container_name: lh-nginx
    ports:
      - "80:80"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - flask1
      - flask2
    networks:
      - lh-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # -----------------------------------------------------------
  # 2. Flask 应用实例 1
  # -----------------------------------------------------------
  flask1:
    build:
      context: ./flask
      dockerfile: Dockerfile
    container_name: lh-flask1
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=lh
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      - MYSQL_DB=appdb
      - TZ=Asia/Shanghai
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - lh-network
    restart: unless-stopped

  # -----------------------------------------------------------
  # 3. Flask 应用实例 2
  # -----------------------------------------------------------
  flask2:
    build:
      context: ./flask
      dockerfile: Dockerfile
    container_name: lh-flask2
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=lh
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      - MYSQL_DB=appdb
      - TZ=Asia/Shanghai
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - lh-network
    restart: unless-stopped

  # -----------------------------------------------------------
  # 4. Redis - 缓存 & 访问计数（AOF + RDB 持久化）
  # -----------------------------------------------------------
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: lh-redis
    environment:
      - TZ=Asia/Shanghai
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 60 1000
      --save 300 10
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - lh-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -----------------------------------------------------------
  # 5. MySQL - 持久化数据存储
  # -----------------------------------------------------------
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: lh-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: appdb
      MYSQL_USER: lh
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      TZ: Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - lh-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

# -----------------------------------------------------------
# 自定义桥接网络
# -----------------------------------------------------------
networks:
  lh-network:
    driver: bridge
    name: lh-network

# -----------------------------------------------------------
# 命名卷（数据持久化）
# -----------------------------------------------------------
volumes:
  redis-data:
    name: lh-redis-data
  mysql-data:
    name: lh-mysql-data
